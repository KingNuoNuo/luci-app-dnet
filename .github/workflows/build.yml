name: Build package

# 用官方 SDK 真编一遍：证明这个目录能直接放进 OpenWrt 源码树
# （package/luci-app-dnet）在 menuconfig 里出现并编译通过。
# 23.05 / 24.10 输出 ipk，25.12 起包管理器换成 apk —— 同一份源码，
# 产物格式由 SDK 决定，包本身不用改。
on:
  push:
    branches: [main]
    paths:
      - 'Makefile'
      - 'root/**'
      - 'htdocs/**'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: SDK ${{ matrix.release }}
    # 必须钉在 24.04：ubuntu-latest 已迁移到 Ubuntu 26，coreutils 换成
    # uutils，OpenWrt 的 prereq 检查里 `install --version | grep GNU coreutils`
    # 会失败（Build dependency: Please install GNU 'install'）。
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: 23.05.5
            sdk: openwrt-sdk-23.05.5-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          - release: 24.10.4
            sdk: openwrt-sdk-24.10.4-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          - release: 25.12.6
            sdk: openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
    env:
      # 前置检查只认 GNU coreutils，容器/发行版一动就可能误报；工具本身都在。
      FORCE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download SDK ${{ matrix.release }}
        run: |
          set -euo pipefail
          # 解压到 runner 的临时目录，绝不能落在仓库里：
          # 否则后面 rsync ./ 会把解压出来的 SDK 再递归复制一次。
          SDK_DIR="$RUNNER_TEMP/openwrt-sdk"
          url="https://downloads.openwrt.org/releases/${{ matrix.release }}/targets/x86/64/${{ matrix.sdk }}"
          echo "$url"
          curl -fsSL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/sdk.tar" "$url"
          mkdir -p "$SDK_DIR"
          case "${{ matrix.sdk }}" in
            *.zst) tar --zstd -xf "$RUNNER_TEMP/sdk.tar" -C "$SDK_DIR" --strip-components=1 ;;
            *)     tar -xf "$RUNNER_TEMP/sdk.tar" -C "$SDK_DIR" --strip-components=1 ;;
          esac
          rm -f "$RUNNER_TEMP/sdk.tar"

      - name: Drop the package into the source tree
        run: |
          set -euo pipefail
          SDK_DIR="$RUNNER_TEMP/openwrt-sdk"
          # 等价于用户把仓库 clone 到 package/luci-app-dnet
          mkdir -p "$SDK_DIR/package/luci-app-dnet"
          rsync -a --exclude .git ./ "$SDK_DIR/package/luci-app-dnet/"
          ls -l "$SDK_DIR/package/luci-app-dnet"

      - name: Build luci-app-dnet
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/openwrt-sdk"
          ./scripts/feeds update -a >/dev/null
          ./scripts/feeds install -a >/dev/null
          # 先把包写进 .config 种子，再让 defconfig 去解析依赖：
          # 依赖不全（比如某个 ucode-mod-* 不在这个 release 里）时，
          # defconfig 会把这一行丢掉，下面的 grep 就会失败 —— 这就是断言。
          touch .config
          printf 'CONFIG_PACKAGE_luci-app-dnet=m\n' >> .config
          # packages feed 里有已知的循环依赖（gensio 等），defconfig 会刷一堆
          # error 但照样写出 .config；只认最终结果。
          make defconfig || true
          grep -q '^CONFIG_PACKAGE_luci-app-dnet=m' .config \
            && echo "luci-app-dnet enabled with all dependencies resolved"
          make package/luci-app-dnet/compile V=s

      - name: Collect package
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/out"
          mkdir -p "$OUT_DIR"
          find "$RUNNER_TEMP/openwrt-sdk/bin" -type f \
            \( -name 'luci-app-dnet*.ipk' -o -name 'luci-app-dnet*.apk' \) \
            -exec cp -v {} "$OUT_DIR"/ \;
          ls -l "$OUT_DIR"
          cd "$OUT_DIR" && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.release }}
          path: ${{ runner.temp }}/out/*
          retention-days: 14


  release:
    name: Publish Release
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: artifacts

      - name: Prepare versioned release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for release in 23.05.5 24.10.4 25.12.6; do
            found=0
            for file in "artifacts/package-$release/"*.ipk "artifacts/package-$release/"*.apk; do
              [ -f "$file" ] || continue
              name="$(basename "$file")"
              cp "$file" "release/openwrt-${release}-${name}"
              found=1
            done
            if [ "$found" -ne 1 ]; then
              echo "::error::No package found for SDK $release"
              exit 1
            fi
          done
          cd release
          shopt -s nullglob
          sha256sum -- *.ipk *.apk > SHA256SUMS

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: D-NET LuCI build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
